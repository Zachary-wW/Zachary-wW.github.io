<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">Proactive loop architecture</title>
  <desc id="desc">A proactive loop starts from a schedule or event, triages work, records state, dispatches isolated agents, verifies results, and reports back to external systems.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5f6368"/>
    </marker>
    <style>
      .box { stroke: #6b7280; stroke-width: 1.4; rx: 10; ry: 10; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .sub { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6368; }
      .arrow { stroke: #5f6368; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b949e; stroke-width: 1.6; stroke-dasharray: 6 7; fill: none; }
    </style>
  </defs>

  <rect width="1160" height="430" fill="#ffffff"/>

  <rect class="box" x="40" y="80" width="160" height="92" fill="#f6f4ef"/>
  <text class="label" x="120" y="116" text-anchor="middle">Trigger</text>
  <text class="sub" x="120" y="144" text-anchor="middle">schedule / API</text>
  <text class="sub" x="120" y="164" text-anchor="middle">GitHub event</text>

  <rect class="box" x="260" y="80" width="160" height="92" fill="#e8f1f4"/>
  <text class="label" x="340" y="116" text-anchor="middle">Triage</text>
  <text class="sub" x="340" y="144" text-anchor="middle">classify work</text>
  <text class="sub" x="340" y="164" text-anchor="middle">choose workflow</text>

  <rect class="box" x="480" y="80" width="160" height="92" fill="#edf4ea"/>
  <text class="label" x="560" y="116" text-anchor="middle">State</text>
  <text class="sub" x="560" y="144" text-anchor="middle">seen items</text>
  <text class="sub" x="560" y="164" text-anchor="middle">next actions</text>

  <rect class="box" x="700" y="45" width="172" height="78" fill="#eef2ff"/>
  <text class="label" x="786" y="78" text-anchor="middle">Agent A</text>
  <text class="sub" x="786" y="104" text-anchor="middle">worktree / repo</text>

  <rect class="box" x="700" y="153" width="172" height="78" fill="#eef2ff"/>
  <text class="label" x="786" y="186" text-anchor="middle">Agent B</text>
  <text class="sub" x="786" y="212" text-anchor="middle">worktree / repo</text>

  <rect class="box" x="700" y="261" width="172" height="78" fill="#eef2ff"/>
  <text class="label" x="786" y="294" text-anchor="middle">Agent N</text>
  <text class="sub" x="786" y="320" text-anchor="middle">bounded task</text>

  <rect class="box" x="932" y="107" width="168" height="92" fill="#fff5d7"/>
  <text class="label" x="1016" y="143" text-anchor="middle">Verifier</text>
  <text class="sub" x="1016" y="171" text-anchor="middle">tests / review</text>
  <text class="sub" x="1016" y="191" text-anchor="middle">stop condition</text>

  <rect class="box" x="932" y="258" width="168" height="92" fill="#f7e8e8"/>
  <text class="label" x="1016" y="294" text-anchor="middle">Report</text>
  <text class="sub" x="1016" y="322" text-anchor="middle">PR / issue</text>
  <text class="sub" x="1016" y="342" text-anchor="middle">Slack / log</text>

  <path class="arrow" d="M200 126 H250"/>
  <path class="arrow" d="M420 126 H470"/>
  <path class="arrow" d="M640 126 C665 126 674 84 692 84"/>
  <path class="arrow" d="M640 126 H690"/>
  <path class="arrow" d="M640 126 C665 126 674 300 692 300"/>
  <path class="arrow" d="M872 84 C902 84 902 143 922 143"/>
  <path class="arrow" d="M872 192 C902 192 902 164 922 164"/>
  <path class="arrow" d="M872 300 C902 300 902 185 922 185"/>
  <path class="arrow" d="M1016 199 V248"/>

  <path class="dash" d="M1016 258 C1016 384 560 390 560 178"/>
  <text class="sub" x="716" y="394" text-anchor="middle">feedback updates state and the next run</text>
</svg>
